apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mime-api
  namespace: mime-api
  labels:
    app: mime-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  rules:
    - host: mime-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mime-api
                port:
                  number: 80